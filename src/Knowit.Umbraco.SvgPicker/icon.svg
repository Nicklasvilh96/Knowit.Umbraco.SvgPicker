<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Knowit ink background -->
  <rect width="256" height="256" rx="40" fill="#0B0B26"/>

  <!-- Subtle grid dividers -->
  <line x1="128" y1="44" x2="128" y2="212" stroke="#FEFBE6" stroke-width="1.5" stroke-linecap="round" opacity="0.12"/>
  <line x1="44"  y1="128" x2="212" y2="128" stroke="#FEFBE6" stroke-width="1.5" stroke-linecap="round" opacity="0.12"/>

  <!-- Top-left: circle -->
  <circle cx="86" cy="86" r="24" fill="none" stroke="#FEFBE6" stroke-width="6.5" stroke-linecap="round" opacity="0.65"/>

  <!-- Top-right: rounded square -->
  <rect x="146" y="62" width="48" height="48" rx="8"
        fill="none" stroke="#FEFBE6" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>

  <!-- Bottom-left: triangle -->
  <polygon points="86,150 58,198 114,198"
           fill="none" stroke="#FEFBE6" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>

  <!-- Bottom-right: star — SELECTED, violet -->
  <!-- Dashed selection ring -->
  <circle cx="170" cy="174" r="34" fill="none" stroke="#9795FF" stroke-width="2.5" stroke-dasharray="5 3.5" opacity="0.75"/>
  <!-- 5-point star, center (170,174), outer r=22, inner r=9 -->
  <polygon points="170,152 174.9,165.5 189.6,165.9 178.3,175.0 182.4,189.6 170,181.5 157.6,189.6 161.7,175.0 150.4,165.9 165.1,165.5"
           fill="none" stroke="#9795FF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
